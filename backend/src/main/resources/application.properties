spring.application.name=backend

server.error.include-message=always
server.error.include-binding-errors=always

# Configuração do banco H2 para salvar no arquivo meubanco na pasta banco
spring.datasource.url=jdbc:h2:file:./banco/meubanco
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Habilita a execução do schema.sql na pasta resources ao iniciar a aplicação
# Esse arquivo cria as tabelas do banco
spring.sql.init.mode=always


server.error.include-exception=true
server.error.include-stacktrace=always